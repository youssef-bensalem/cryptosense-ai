# Daily market-data refresh, run by GitHub.
# Save as .github/workflows/refresh-data.yml.
#
# It restores the previously published data, downloads only the new candles
# from Binance's market-data address, and publishes the result as two files
# on the "market-data" release of this repository. Only public prices are
# read: no account, no API key, and no trading. The news study's files are
# never touched or published.
#
# When it runs:
#   - once whenever this file is pushed (on any branch), so it can be tried out;
#   - every day at 00:20 UTC, but only once this file is on the default branch
#     (GitHub runs schedules from the default branch only);
#   - by hand from the Actions tab (also needs the file on the default branch).
name: Refresh market data

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write   # needed to publish the release files; nothing in the code is changed

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

env:
  CRYPTOSENSE_BINANCE_URL: https://data-api.binance.vision/api/v3
  RELEASE_TAG: market-data
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the project
        run: python -m pip install -r requirements.txt

      - name: Restore the previously published data
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --dir previous --pattern "market-data-*.tar.gz"
            python -m cryptosense.refresh unpack previous/market-data-processed.tar.gz previous/market-data-raw.tar.gz
          else
            echo "No published data yet: the whole history will be downloaded (this takes several minutes)."
          fi

      - name: Download new candles
        run: python -m cryptosense.refresh update

      - name: Pack the data
        run: python -m cryptosense.refresh pack --out publish

      - name: Publish
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Market data" --latest=false \
              --notes "Daily and 15-minute Binance candles for the CryptoSense AI web interface, refreshed by the 'Refresh market data' workflow. Not a software release."
          fi
          gh release upload "$RELEASE_TAG" publish/market-data-processed.tar.gz publish/market-data-raw.tar.gz --clobber
